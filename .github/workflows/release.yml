name: Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: release-workflow
  cancel-in-progress: false

permissions:
  contents: write

env:
  NODE_VERSION: '24.10'
  # Opt in early to Node 24 runtime for JavaScript-based actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Phase 0: Determine the next release version via a semantic-release dry-run.
  #
  # semantic-release is deterministic: given the same commits since the last
  # tag it always computes the same next version.  Running --dry-run here lets
  # us know the version before the Windows builds start, so electron-builder
  # stamps the correct version into every artifact filename.
  #
  # If no releasable commits are found (e.g. only chore/docs), next-version is
  # set to '' and all downstream jobs are skipped via their `if:` guards —
  # no Windows runners are wasted.
  # ─────────────────────────────────────────────────────────────────────────
  determine-version:
    name: Determine next release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      next-version: ${{ steps.version.outputs.next-version }}
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Dry-run semantic-release to extract next version
        id: version
        run: |
          NEXT=$(npx semantic-release --dry-run 2>&1 \
            | grep -oP '(?<=The next release version is )\S+' \
            || true)
          echo "next-version=${NEXT}" >> "$GITHUB_OUTPUT"
          if [ -z "$NEXT" ]; then
            echo "No releasable commits found — downstream jobs will be skipped."
          else
            echo "Next release version: $NEXT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 1: Build artifacts (parallel).
  # Each job bumps package.json locally (no commit/tag) so electron-builder
  # reads the correct version and stamps it into the artifact filename.
  # ─────────────────────────────────────────────────────────────────────────
  build-windows-installer:
    name: Build Windows (installer)
    needs: [determine-version]
    if: needs.determine-version.outputs.next-version != ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --force

      - name: Bump version to match release (${{ needs.determine-version.outputs.next-version }})
        run: npm version ${{ needs.determine-version.outputs.next-version }} --no-git-tag-version

      - name: Windows installer
        env:
          # No code-signing cert: do not search for one. Full PE / asar-integrity still runs (CI=true; see electron-builder.mjs).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # electron-builder checks GH_TOKEN / GITHUB_TOKEN when preparing publish metadata.
          # Use built-in github.token here because this job only needs repo-scoped runtime auth.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run compile:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: maxframe-win-installer
          path: dist/*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  build-windows-portable:
    name: Build Windows (portable)
    needs: [determine-version]
    if: needs.determine-version.outputs.next-version != ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --force

      - name: Bump version to match release (${{ needs.determine-version.outputs.next-version }})
        run: npm version ${{ needs.determine-version.outputs.next-version }} --no-git-tag-version

      - name: Windows portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run compile:win:portable

      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          name: maxframe-win-portable
          path: dist/*-portable-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 2: Smoke tests (parallel, after respective builds).
  # ─────────────────────────────────────────────────────────────────────────
  smoke-windows:
    name: Smoke (Windows installer)
    needs: [determine-version, build-windows-installer]
    if: needs.determine-version.outputs.next-version != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-installer
          path: win-smoke

      - name: Run smoke
        env:
          SMOKE_INSTALLER_DIR: win-smoke
          MAXFRAME_CI_SMOKE: '1'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-smoke-test.ps1"

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  smoke-windows-portable:
    name: Smoke (Windows portable)
    needs: [determine-version, build-windows-portable]
    if: needs.determine-version.outputs.next-version != ''
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download portable
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-portable
          path: win-smoke-portable

      - name: Run smoke
        env:
          SMOKE_INSTALLER_DIR: win-smoke-portable
          MAXFRAME_CI_SMOKE: '1'
        shell: powershell
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-portable-smoke-test.ps1"

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-portable-smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 3: Full semantic-release.
  # Both smokes must pass.  semantic-release re-analyses commits (same result
  # as dry-run), creates the git tag, updates CHANGELOG.md, and uploads the
  # now-correctly-named artifacts to the GitHub Release.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Semantic release
    needs: [determine-version, smoke-windows, smoke-windows-portable]
    if: needs.determine-version.outputs.next-version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep explicit secret token for semantic-release (can be PAT-backed, independent from github.token runtime scope).
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-installer
          path: release-assets

      - name: Download Windows portable
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-portable
          path: release-assets

      - name: Verify release assets
        run: |
          ls -1 release-assets/*-win-x64.exe
          ls -1 release-assets/*-portable-win-x64.exe

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Release
        run: npm run release
