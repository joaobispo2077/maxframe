name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate-release-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Capture tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Validate semantic tag pattern
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag format: $TAG"
            exit 1
          fi

      - name: Ensure tag points to release branch commit
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          COMMIT_SHA="$(git rev-list -n 1 "$TAG")"
          git fetch origin release --depth=1
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "origin/release"; then
            echo "Tag $TAG does not point to a commit from release branch."
            exit 1
          fi

  release-checks:
    name: Release Checks
    runs-on: ubuntu-latest
    needs: validate-release-tag
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: E2E tests
        run: npm run test:e2e

  draft-release:
    name: Draft GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-release-tag, release-checks]
    permissions:
      contents: write
    steps:
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-release-tag.outputs.tag }}
          draft: true
          generate_release_notes: true
