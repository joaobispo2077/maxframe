# Maintainer-only workflow to build and smoke-test both Windows artifacts on demand.
name: Installer smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24.10'
  # Opt in early to the Node 24 runtime for JavaScript-based actions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --force

      - name: Download yt-dlp and ffmpeg binaries
        shell: powershell
        run: |
          # yt-dlp 2026.03.17 (pinned — update when upgrading yt-dlp)
          Invoke-WebRequest `
            -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.03.17/yt-dlp.exe' `
            -OutFile 'buildResources\yt-dlp\yt-dlp.exe'

          # ffmpeg static GPL build from yt-dlp/FFmpeg-Builds (build 2026-04-11, rolling latest tag)
          $zip = Join-Path $env:TEMP 'ffmpeg.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip' `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP 'ffmpeg-extract') -Force
          $exe = Get-ChildItem -Recurse (Join-Path $env:TEMP 'ffmpeg-extract') -Filter 'ffmpeg.exe' |
                 Select-Object -First 1
          Copy-Item $exe.FullName 'buildResources\ffmpeg\ffmpeg.exe'

      - name: Build Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run compile:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: maxframe-win-installer
          path: dist/*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  build-windows-portable:
    name: Build Windows portable
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Cache Electron (Windows)
        uses: actions/cache@v5
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci --force

      - name: Download yt-dlp and ffmpeg binaries
        shell: powershell
        run: |
          # yt-dlp 2026.03.17 (pinned — update when upgrading yt-dlp)
          Invoke-WebRequest `
            -Uri 'https://github.com/yt-dlp/yt-dlp/releases/download/2026.03.17/yt-dlp.exe' `
            -OutFile 'buildResources\yt-dlp\yt-dlp.exe'

          # ffmpeg static GPL build from yt-dlp/FFmpeg-Builds (build 2026-04-11, rolling latest tag)
          $zip = Join-Path $env:TEMP 'ffmpeg.zip'
          Invoke-WebRequest `
            -Uri 'https://github.com/yt-dlp/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip' `
            -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath (Join-Path $env:TEMP 'ffmpeg-extract') -Force
          $exe = Get-ChildItem -Recurse (Join-Path $env:TEMP 'ffmpeg-extract') -Filter 'ffmpeg.exe' |
                 Select-Object -First 1
          Copy-Item $exe.FullName 'buildResources\ffmpeg\ffmpeg.exe'

      - name: Build Windows portable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run compile:win:portable

      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          name: maxframe-win-portable
          path: dist/*-portable-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    name: Smoke (Windows installer)
    needs: [build-windows-installer]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download installer
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-installer
          path: win-smoke

      - name: Run smoke script
        shell: powershell
        env:
          SMOKE_INSTALLER_DIR: win-smoke
          MAXFRAME_CI_SMOKE: '1'
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-smoke-test.ps1"

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  smoke-portable:
    name: Smoke (Windows portable)
    needs: [build-windows-portable]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download portable
        uses: actions/download-artifact@v8
        with:
          name: maxframe-win-portable
          path: win-smoke-portable

      - name: Run smoke script
        shell: powershell
        env:
          SMOKE_INSTALLER_DIR: win-smoke-portable
          MAXFRAME_CI_SMOKE: '1'
        run: |
          & "$env:GITHUB_WORKSPACE\scripts\windows-portable-smoke-test.ps1"

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-portable-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
