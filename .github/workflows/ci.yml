name: CI

on:
  push:
    branches:
      - release
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main
      - develop

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run typecheck
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run typecheck > reports/quality/typecheck.log 2>&1
          code=$?
          cat reports/quality/typecheck.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: typecheck
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-typecheck
          path: reports/quality/gates/typecheck/gate.json
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run lint
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run lint -- -f json -o reports/quality/eslint.json
          lint_code=$?
          node scripts/ci/check-lint-baseline.mjs
          base_code=$?
          if [ "$lint_code" -ne 0 ]; then exit "$lint_code"; fi
          exit "$base_code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: lint
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-lint
          path: reports/quality/gates/lint/gate.json
          if-no-files-found: error
          retention-days: 14

  format:
    name: Format
    # Throwaway proof: a skipped required job must fail CI readiness.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run format check
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run format:check > reports/quality/prettier.log 2>&1
          code=$?
          cat reports/quality/prettier.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: format
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-format
          path: reports/quality/gates/format/gate.json
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run unit tests
        id: gate
        env:
          MAXFRAME_FAKE_VIDEO_METADATA: '1'
        # Coverage flags are baked into the root script to ensure Vitest always writes summary JSON.
        run: |
          mkdir -p reports/quality
          npm run test:unit:coverage -- --reporter=default --reporter=json --outputFile.json=reports/quality/vitest.json

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: unit-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-unit-tests
          path: reports/quality/gates/unit-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Cypress run
        id: gate
        uses: cypress-io/github-action@v7
        with:
          component: true
          install-command: npm ci || { rm -rf node_modules && npm ci; }

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: e2e-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-e2e-tests
          path: reports/quality/gates/e2e-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Ensure reports directory for Stryker cache
        run: mkdir -p reports

      # Exact key only. A prefix restore must not supply a score.
      - name: Cache Stryker incremental report (exact key only)
        id: stryker-cache
        uses: actions/cache@v5
        with:
          path: reports/stryker-incremental.pr.json
          key: stryker-incremental-pr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.base.mjs', 'stryker.config.pr.mjs', 'vitest.stryker.config.ts') }}

      - name: Reject non-exact Stryker cache
        env:
          STRYKER_CACHE_HIT: ${{ steps.stryker-cache.outputs.cache-hit }}
          STRYKER_CACHE_MATCHED_KEY: ${{ steps.stryker-cache.outputs.cache-matched-key }}
        run: node scripts/ci/accept-stryker-cache.mjs

      - name: Run mutation tests
        id: gate
        run: |
          mkdir -p reports/quality
          set -o pipefail
          npm run test:mutation:pr:incremental 2>&1 | tee reports/quality/stryker.log

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: mutation-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-mutation-tests
          path: reports/quality/gates/mutation-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload mutation reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: reports/mutation
          if-no-files-found: error
          retention-days: 7

  scheduled-workflow:
    name: Scheduled workflow state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Warn when Stryker full is disabled
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_WORKFLOW: stryker-full.yml
        run: node scripts/ci/check-scheduled-workflow.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: scheduled-workflow
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-scheduled-workflow
          path: reports/quality/gates/scheduled-workflow/gate.json
          if-no-files-found: error
          retention-days: 14

  ci-readiness:
    name: CI readiness
    if: always()
    needs:
      - typecheck
      - lint
      - format
      - unit-tests
      - e2e-tests
      - mutation-tests
      - scheduled-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: write
    outputs:
      result: ${{ steps.readiness.outputs.result }}
      status: ${{ steps.readiness.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Require successful required jobs and gate.json
        id: readiness
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          FETCH_GATE_ARTIFACTS: '1'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-ci-readiness.mjs

      - name: Render maxframe quality report
        if: always()
        run: node scripts/ci/render-quality-report.mjs

      - name: Publish maxframe quality comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: maxframe-quality
          path: reports/quality/maxframe-quality.md
          recreate: true

      - name: Upload CI readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-readiness
          path: |
            reports/quality/ci-readiness.json
            reports/quality/gates/ci-readiness/gate.json
            reports/quality/maxframe-quality.md
          if-no-files-found: error
          retention-days: 14
