name: CI

on:
  push:
    branches:
      - release
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main
      - develop

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run typecheck
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run typecheck > reports/quality/typecheck.log 2>&1
          code=$?
          cat reports/quality/typecheck.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: typecheck
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-typecheck-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/typecheck
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run lint
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run lint -- -f json -o reports/quality/eslint.json
          lint_code=$?
          node scripts/ci/check-lint-baseline.mjs
          base_code=$?
          if [ "$lint_code" -ne 0 ]; then exit "$lint_code"; fi
          exit "$base_code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: lint
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-lint-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/lint
          if-no-files-found: error
          retention-days: 14

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run format check
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run format:check > reports/quality/prettier.log 2>&1
          code=$?
          cat reports/quality/prettier.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: format
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-format-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/format
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run unit tests
        id: gate
        env:
          MAXFRAME_FAKE_VIDEO_METADATA: '1'
        run: |
          mkdir -p reports/quality
          npm run test:unit:coverage -- --reporter=default --reporter=json --outputFile.json=reports/quality/vitest.json

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: unit-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-unit-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/unit-tests
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Cypress run
        id: gate
        uses: cypress-io/github-action@v7
        with:
          component: true
          install-command: npm ci || { rm -rf node_modules && npm ci; }

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: e2e-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-e2e-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/e2e-tests
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-attempt-${{ github.run_attempt }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  accessibility:
    name: Accessibility (cypress-axe)
    # Serves the built renderer and runs cypress-axe headless.
    # The Electron window is not the page this job drives.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Scan the built renderer with cypress-axe
        id: scan
        uses: cypress-io/github-action@v7
        with:
          install-command: npm ci || { rm -rf node_modules && npm ci; }
          build: npm run build:a11y -w @maxframe/renderer
          start: npm run preview -w @maxframe/renderer -- --host 127.0.0.1 --port 4173 --strictPort
          wait-on: http://127.0.0.1:4173
          wait-on-timeout: 120
          command: npm run test:a11y

      - name: Check accessibility
        if: always()
        id: gate
        run: node scripts/ci/check-accessibility.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: accessibility
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-accessibility-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/accessibility
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Coverage
    # Not an intentional success skip. This is false only when the run is
    # cancelled. ci-readiness still runs and treats that skip as a failure.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: coverage

      - name: Check coverage floors
        id: gate
        run: node scripts/ci/check-coverage.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: coverage
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-coverage-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/coverage
          if-no-files-found: error
          retention-days: 14

  complexity:
    name: CRAP / complexity
    # Not an intentional success skip. Same cancel-only guard as coverage.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: coverage

      - name: Check CRAP and complexity
        id: gate
        run: node scripts/ci/check-complexity.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: complexity
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-complexity-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/complexity
          if-no-files-found: error
          retention-days: 14

  crap:
    name: CRAP top 10
    # Not an intentional success skip. Same cancel-only guard as coverage.
    # Production functions only. The script skips tests.
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: coverage

      - name: Check CRAP top 10
        id: gate
        run: node scripts/ci/check-crap.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: crap
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-crap-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/crap
          if-no-files-found: error
          retention-days: 14

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check duplication
        id: gate
        run: node scripts/ci/check-duplication.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: duplication
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-duplication-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/duplication
          if-no-files-found: error
          retention-days: 14

  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check dead code
        id: gate
        run: node scripts/ci/check-deadcode.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: deadcode
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-deadcode-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/deadcode
          if-no-files-found: error
          retention-days: 14

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check architecture
        id: gate
        run: node scripts/ci/check-architecture.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: architecture
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-architecture-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/architecture
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Check npm audit
        id: gate
        run: node scripts/ci/check-audit.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: audit
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-audit-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/audit
          if-no-files-found: error
          retention-days: 14

  find-dupes:
    name: Dependency tree
    # Package names in package-lock.json resolved at more than one version.
    # npm find-dupes follows the registry, so that plan is not the ceiling.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Check dependency tree
        id: gate
        run: node scripts/ci/check-find-dupes.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: find-dupes
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-find-dupes-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/find-dupes
          if-no-files-found: error
          retention-days: 14

  electron-security:
    name: Electron security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Check Electron security flags
        id: gate
        run: node scripts/ci/check-electron-security.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: electron-security
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-electron-security-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/electron-security
          if-no-files-found: error
          retention-days: 14

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch PR base
        run: |
          base="${GITHUB_BASE_REF:-develop}"
          git fetch --no-tags origin "$base"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Record mutation scope
        id: mutation-scope
        env:
          PR_BASE_REF: ${{ github.base_ref || 'develop' }}
        run: node scripts/ci/mutation-scope.mjs

      - name: Ensure reports directory for Stryker cache
        run: mkdir -p reports

      - name: Cache Stryker incremental report (exact key only)
        id: stryker-cache
        if: steps.mutation-scope.outputs.profile == 'incremental'
        uses: actions/cache@v5
        with:
          path: reports/stryker-incremental.pr.json
          key: stryker-incremental-pr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.base.mjs', 'stryker.config.pr.mjs', 'vitest.stryker.config.ts', 'scripts/ci/quality-floors.mjs') }}

      - name: Reject non-exact Stryker cache
        if: steps.mutation-scope.outputs.profile == 'incremental'
        env:
          STRYKER_CACHE_HIT: ${{ steps.stryker-cache.outputs.cache-hit }}
          STRYKER_CACHE_MATCHED_KEY: ${{ steps.stryker-cache.outputs.cache-matched-key }}
        run: node scripts/ci/accept-stryker-cache.mjs

      - name: Run mutation tests
        id: gate
        run: |
          mkdir -p reports/quality reports/mutation
          mutable="${{ steps.mutation-scope.outputs.mutable }}"
          profile="${{ steps.mutation-scope.outputs.profile }}"
          if [ "$mutable" = "false" ]; then
            echo "No mutable source changed."
            printf '%s\n' 'no mutable source changed' > reports/mutation/not-run.txt
            exit 0
          fi
          if [ "$mutable" != "true" ]; then
            echo "Diff against the mutate set is unavailable."
            printf '%s\n' 'diff unavailable' > reports/mutation/not-run.txt
            exit 1
          fi
          set -o pipefail
          if [ "$profile" = "incremental" ]; then
            npm run test:mutation:pr:incremental 2>&1 | tee reports/quality/stryker.log
          else
            rm -f reports/stryker-incremental.pr.json
            node --input-type=module -e '
              import { applyStrykerCacheDecision } from "./scripts/ci/accept-stryker-cache.mjs";
              applyStrykerCacheDecision({
                cacheHit: "false",
                matchedKey: "",
                incrementalFile: "reports/stryker-incremental.pr.json",
                decisionFile: "reports/quality/stryker-cache.json",
              });
            '
            echo "Tests or mutation config changed. Fresh PR mutate set."
            echo "GATE_MUTATION_PROFILE=fresh" >> "$GITHUB_ENV"
            npm run test:mutation:pr 2>&1 | tee reports/quality/stryker.log
          fi

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: mutation-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-mutation-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/mutation-tests
          if-no-files-found: error
          retention-days: 14

      - name: Upload mutation reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports-attempt-${{ github.run_attempt }}
          path: reports/mutation
          if-no-files-found: error
          retention-days: 7

  scheduled-workflow:
    name: Scheduled workflow state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Warn when Stryker full is disabled
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_WORKFLOW: stryker-full.yml
        run: node scripts/ci/check-scheduled-workflow.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: scheduled-workflow
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-scheduled-workflow-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/scheduled-workflow
          if-no-files-found: error
          retention-days: 14

  ci-readiness:
    name: CI readiness
    # Exactly `always()`. `always() && !cancelled()` is false when the run
    # is cancelled, so GitHub skips this job. A skipped required check is a
    # pass. The script fails the job when any needed result is cancelled,
    # skipped, or failed. See docs/maxframe-quality-gates.md.
    if: always()
    needs:
      - typecheck
      - lint
      - format
      - unit-tests
      - e2e-tests
      - accessibility
      - coverage
      - complexity
      - crap
      - duplication
      - deadcode
      - architecture
      - audit
      - find-dupes
      - electron-security
      - mutation-tests
      - scheduled-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      result: ${{ steps.readiness.outputs.result }}
      status: ${{ steps.readiness.outputs.status }}
    steps:
      # Steps default to success(), which is false after a cancellation, so
      # they would skip and this job could finish without running the script.
      # always() keeps checkout, setup, and the script on that path.
      - name: Checkout
        if: always()
        uses: actions/checkout@v6

      - name: Setup Node
        if: always()
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Require successful required jobs and gate.json
        id: readiness
        if: always()
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          FETCH_GATE_ARTIFACTS: '1'
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_BASE_REF: ${{ github.base_ref || '' }}
        run: node scripts/ci/check-ci-readiness.mjs

      - name: Upload CI readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-readiness-attempt-${{ github.run_attempt }}
          path: |
            reports/quality/ci-readiness.json
            reports/quality/gates/ci-readiness/gate.json
          if-no-files-found: error
          retention-days: 14

      # Backstop: needs can all be success while the run itself was cancelled.
      # The script would pass, and a skipped step would not turn the check red.
      - name: Fail when the workflow was cancelled
        if: cancelled()
        run: |
          echo "CI readiness: FAIL. The workflow run was cancelled."
          exit 1

  quality-comments:
    name: Quality comments
    # Not the required check. A cancelled run may skip the sticky.
    if: always() && !cancelled()
    needs: ci-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Download CI readiness
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ci-readiness-attempt-${{ github.run_attempt }}
          path: reports/quality

      - name: Render stickies
        id: render
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_READINESS_REPORT: reports/quality/ci-readiness.json
        run: node scripts/ci/render-stickies.mjs

      - name: Publish Software metrics comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gates-report
          path: reports/quality/software-metrics.md

      - name: Publish Mutation tests comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-report
          path: reports/quality/mutation-report.md
          recreate: true

      - name: Remove superseded maxframe quality comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: maxframe-quality
          delete: true

      - name: Remove superseded coverage comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-coverage
          delete: true

      - name: Remove superseded mutation summary comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-test-results
          delete: true

      - name: Upload chart artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-charts-attempt-${{ github.run_attempt }}
          path: reports/quality/charts
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when a sticky overall blocks
        if: always() && !cancelled()
        run: |
          if [ "${{ steps.render.outcome }}" != "success" ]; then
            echo "Sticky render overall is FAIL or UNKNOWN."
            exit 1
          fi
