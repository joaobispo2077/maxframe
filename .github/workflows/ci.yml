name: CI

on:
  push:
    branches:
      - release
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main
      - develop

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        # One retry: a truncated Cypress binary fails npm ci on a checksum mismatch.
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run typecheck
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run typecheck > reports/quality/typecheck.log 2>&1
          code=$?
          cat reports/quality/typecheck.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: typecheck
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-typecheck-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/typecheck/gate.json
          if-no-files-found: error
          retention-days: 14

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run lint
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run lint -- -f json -o reports/quality/eslint.json
          lint_code=$?
          node scripts/ci/check-lint-baseline.mjs
          base_code=$?
          if [ "$lint_code" -ne 0 ]; then exit "$lint_code"; fi
          exit "$base_code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: lint
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-lint-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/lint/gate.json
          if-no-files-found: error
          retention-days: 14

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run format check
        id: gate
        run: |
          mkdir -p reports/quality
          set +e
          npm run format:check > reports/quality/prettier.log 2>&1
          code=$?
          cat reports/quality/prettier.log
          exit "$code"

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: format
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-format-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/format/gate.json
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Run unit tests
        id: gate
        env:
          MAXFRAME_FAKE_VIDEO_METADATA: '1'
        run: |
          mkdir -p reports/quality
          npm run test:unit:coverage -- --reporter=default --reporter=json --outputFile.json=reports/quality/vitest.json

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: unit-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-unit-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/unit-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 7

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    needs: typecheck
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Cypress run
        id: gate
        uses: cypress-io/github-action@v7
        with:
          component: true
          install-command: npm ci || { rm -rf node_modules && npm ci; }

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: e2e-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-e2e-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/e2e-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-attempt-${{ github.run_attempt }}
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  coverage:
    name: Coverage
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: coverage

      - name: Check coverage floors
        id: gate
        run: node scripts/ci/check-coverage.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: coverage
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-coverage-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/coverage/gate.json
          if-no-files-found: error
          retention-days: 14

  complexity:
    name: CRAP / complexity
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Download unit coverage
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: unit-coverage-attempt-${{ github.run_attempt }}
          path: coverage

      - name: Check CRAP and complexity
        id: gate
        run: node scripts/ci/check-complexity.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: complexity
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-complexity-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/complexity/gate.json
          if-no-files-found: error
          retention-days: 14

  duplication:
    name: Duplication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check duplication
        id: gate
        run: node scripts/ci/check-duplication.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: duplication
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-duplication-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/duplication/gate.json
          if-no-files-found: error
          retention-days: 14

  deadcode:
    name: Dead code
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check dead code
        id: gate
        run: node scripts/ci/check-deadcode.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: deadcode
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-deadcode-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/deadcode/gate.json
          if-no-files-found: error
          retention-days: 14

  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Check architecture
        id: gate
        run: node scripts/ci/check-architecture.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: architecture
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-architecture-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/architecture/gate.json
          if-no-files-found: error
          retention-days: 14

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Check npm audit
        id: gate
        run: node scripts/ci/check-audit.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: audit
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-audit-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/audit/gate.json
          if-no-files-found: error
          retention-days: 14

  electron-security:
    name: Electron security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Check Electron security flags
        id: gate
        run: node scripts/ci/check-electron-security.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: electron-security
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-electron-security-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/electron-security/gate.json
          if-no-files-found: error
          retention-days: 14

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch PR base
        run: |
          base="${GITHUB_BASE_REF:-develop}"
          git fetch --no-tags origin "$base"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci || { rm -rf node_modules && npm ci; }

      - name: Record mutation scope
        env:
          PR_BASE_REF: ${{ github.base_ref || 'develop' }}
        run: node scripts/ci/mutation-scope.mjs

      - name: Ensure reports directory for Stryker cache
        run: mkdir -p reports

      - name: Cache Stryker incremental report (exact key only)
        id: stryker-cache
        uses: actions/cache@v5
        with:
          path: reports/stryker-incremental.pr.json
          key: stryker-incremental-pr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.base.mjs', 'stryker.config.pr.mjs', 'vitest.stryker.config.ts', 'scripts/ci/quality-floors.mjs') }}

      - name: Reject non-exact Stryker cache
        env:
          STRYKER_CACHE_HIT: ${{ steps.stryker-cache.outputs.cache-hit }}
          STRYKER_CACHE_MATCHED_KEY: ${{ steps.stryker-cache.outputs.cache-matched-key }}
        run: node scripts/ci/accept-stryker-cache.mjs

      - name: Run mutation tests
        id: gate
        run: |
          mkdir -p reports/quality
          set -o pipefail
          npm run test:mutation:pr:incremental 2>&1 | tee reports/quality/stryker.log

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: mutation-tests
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-mutation-tests-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/mutation-tests/gate.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload mutation reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports-attempt-${{ github.run_attempt }}
          path: reports/mutation
          if-no-files-found: error
          retention-days: 7

  scheduled-workflow:
    name: Scheduled workflow state
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Warn when Stryker full is disabled
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEDULED_WORKFLOW: stryker-full.yml
        run: node scripts/ci/check-scheduled-workflow.mjs

      - name: Write gate.json
        if: always()
        env:
          GATE_JOB: scheduled-workflow
          GATE_OUTCOME: ${{ job.status }}
        run: node scripts/ci/write-gate-json.mjs

      - name: Upload gate.json
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gate-scheduled-workflow-attempt-${{ github.run_attempt }}
          path: reports/quality/gates/scheduled-workflow/gate.json
          if-no-files-found: error
          retention-days: 14

  ci-readiness:
    name: CI readiness
    if: always() && !cancelled()
    needs:
      - typecheck
      - lint
      - format
      - unit-tests
      - e2e-tests
      - coverage
      - complexity
      - duplication
      - deadcode
      - architecture
      - audit
      - electron-security
      - mutation-tests
      - scheduled-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      result: ${{ steps.readiness.outputs.result }}
      status: ${{ steps.readiness.outputs.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Require successful required jobs and gate.json
        id: readiness
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          FETCH_GATE_ARTIFACTS: '1'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-ci-readiness.mjs

      - name: Upload CI readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-readiness-attempt-${{ github.run_attempt }}
          path: |
            reports/quality/ci-readiness.json
            reports/quality/gates/ci-readiness/gate.json
          if-no-files-found: error
          retention-days: 14

  quality-comments:
    name: Quality comments
    if: always() && !cancelled()
    needs: ci-readiness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Download CI readiness
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ci-readiness-attempt-${{ github.run_attempt }}
          path: reports/quality

      - name: Render stickies
        id: render
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CI_READINESS_REPORT: reports/quality/ci-readiness.json
        run: node scripts/ci/render-stickies.mjs

      - name: Publish Software metrics comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: quality-gates-report
          path: reports/quality/software-metrics.md
          recreate: true

      - name: Publish Mutation tests comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-report
          path: reports/quality/mutation-report.md
          recreate: true

      - name: Remove superseded maxframe quality comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: maxframe-quality
          delete: true

      - name: Remove superseded coverage comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: code-coverage
          delete: true

      - name: Remove superseded mutation summary comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: mutation-test-results
          delete: true

      - name: Upload chart artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-charts-attempt-${{ github.run_attempt }}
          path: reports/quality/charts
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when a sticky overall is not PASS
        if: always() && !cancelled()
        run: |
          if [ "${{ steps.render.outcome }}" != "success" ]; then
            echo "Sticky render overall is FAIL or UNKNOWN."
            exit 1
          fi
