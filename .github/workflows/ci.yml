name: CI

on:
  push:
    branches:
      - release
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main
      - develop

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel this run so the job result is cancelled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 15
          gh run cancel "$GITHUB_RUN_ID"
          sleep 60

  lint:
    name: Lint
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo lint

  format:
    name: Format
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo format

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo unit

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo e2e

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo mutation

  scheduled-workflow:
    name: Scheduled workflow state
    runs-on: ubuntu-latest
    if: false
    steps:
      - run: echo scheduled

  ci-readiness:
    name: CI readiness
    if: always()
    needs:
      - typecheck
      - lint
      - format
      - unit-tests
      - e2e-tests
      - mutation-tests
      - scheduled-workflow
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'

      - name: Require successful required jobs and gate.json
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
          FETCH_GATE_ARTIFACTS: '1'
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/check-ci-readiness.mjs

      - name: Upload CI readiness artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-readiness
          path: |
            reports/quality/ci-readiness.json
            reports/quality/gates/ci-readiness/gate.json
          if-no-files-found: error
          retention-days: 14
