name: CI

on:
  push:
    branches:
      - release
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
            (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
          )
        )
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
            (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
          )
        )
      }}
    timeout-minutes: 15
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run unit tests
        run: npm run test:unit -- --coverage --coverage.reporter=json-summary --coverage.reporter=cobertura

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-summary
          path: packages/renderer/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate coverage summary markdown
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const summaryPath = 'packages/renderer/coverage/coverage-summary.json';
          const outputPath = 'code-coverage-results.md';
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const total = summary.total;
          const pct = (value) => `${Number(value).toFixed(2)}%`;

          const lines = [
            '## Unit Test Coverage',
            '',
            '| Metric | Covered / Total | % |',
            '|---|---:|---:|',
            `| Lines | ${total.lines.covered} / ${total.lines.total} | ${pct(total.lines.pct)} |`,
            `| Statements | ${total.statements.covered} / ${total.statements.total} | ${pct(total.statements.pct)} |`,
            `| Functions | ${total.functions.covered} / ${total.functions.total} | ${pct(total.functions.pct)} |`,
            `| Branches | ${total.branches.covered} / ${total.branches.total} | ${pct(total.branches.pct)} |`,
            '',
            '_Generated from Vitest coverage-summary.json_',
          ];

          fs.writeFileSync(outputPath, `${lines.join('\n')}\n`);
          EOF

      - name: Publish coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: code-coverage-results.md
          recreate: true

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    needs: typecheck
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
          (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
        )
      }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          component: true
          install-command: npm ci --force

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

