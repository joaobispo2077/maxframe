name: CI

on:
  push:
    branches:
      - release
      - dev
      - 'feature/**'
  pull_request:
    branches:
      - release
      - main

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
            (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
          )
        )
      }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run typecheck
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: typecheck
    if: >-
      ${{
        github.event_name == 'push' ||
        (
          github.event_name == 'pull_request' &&
          (
            (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
            (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
          )
        )
      }}
    timeout-minutes: 15
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Run unit tests
        env:
          MAXFRAME_FAKE_VIDEO_METADATA: '1'
        # Coverage flags are baked into the root script to ensure Vitest always writes summary JSON.
        run: npm run test:unit:coverage

      - name: Upload unit coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 7

      - name: Generate coverage summary markdown
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const summaryPath = 'coverage/coverage-summary.json';
          const outputPath = 'code-coverage-results.md';
          const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
          const total = summary.total;
          const pct = (value) => `${Number(value).toFixed(2)}%`;

          const lines = [
            '## Unit Test Coverage',
            '',
            '| Metric | Covered / Total | % |',
            '|---|---:|---:|',
            `| Lines | ${total.lines.covered} / ${total.lines.total} | ${pct(total.lines.pct)} |`,
            `| Statements | ${total.statements.covered} / ${total.statements.total} | ${pct(total.statements.pct)} |`,
            `| Functions | ${total.functions.covered} / ${total.functions.total} | ${pct(total.functions.pct)} |`,
            `| Branches | ${total.branches.covered} / ${total.branches.total} | ${pct(total.branches.pct)} |`,
            '',
            '_Generated from Vitest coverage-summary.json_',
          ];

          fs.writeFileSync(outputPath, `${lines.join('\n')}\n`);
          EOF

      - name: Publish coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: code-coverage-results.md
          recreate: true

  e2e-tests:
    name: E2E Tests (Cypress Component)
    runs-on: ubuntu-latest
    needs: typecheck
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
          (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
        )
      }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Cypress run
        uses: cypress-io/github-action@v7
        with:
          component: true
          install-command: npm ci --force

      - name: Upload Cypress screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  mutation-tests:
    name: Mutation Tests (Stryker)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          (github.base_ref == 'release' && startsWith(github.head_ref, 'dev')) ||
          (github.base_ref == 'main' && startsWith(github.head_ref, 'release'))
        )
      }}
    timeout-minutes: 30
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Ensure reports directory for Stryker cache
        run: mkdir -p reports

      - name: Cache Stryker incremental report
        uses: actions/cache@v5
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ runner.os }}-${{ hashFiles('package-lock.json', 'stryker.config.mjs', 'vitest.stryker.config.ts') }}
          restore-keys: |
            stryker-incremental-${{ runner.os }}-

      - name: Run mutation tests
        id: run-mutation-tests
        run: npm run test:mutation:incremental

      - name: Upload mutation reports artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-reports
          path: reports/mutation
          if-no-files-found: warn
          retention-days: 7

      - name: Generate mutation summary markdown
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const path = require('node:path');

          const outputPath = 'mutation-test-results.md';
          const mutationJsonPath = path.join('reports', 'mutation', 'mutation.json');
          const fallback = [
            '## Mutation Tests (Stryker)',
            '',
            'Mutation report JSON was not found. Check the job logs and the uploaded `mutation-reports` artifact.',
            '',
            '_Generated by CI mutation job_',
          ];

          if (!fs.existsSync(mutationJsonPath)) {
            fs.writeFileSync(outputPath, `${fallback.join('\n')}\n`);
            process.exit(0);
          }

          const report = JSON.parse(fs.readFileSync(mutationJsonPath, 'utf8'));
          const threshold = report.thresholds?.break;
          const counts = {
            Killed: 0,
            Survived: 0,
            Timeout: 0,
            NoCoverage: 0,
            RuntimeError: 0,
            CompileError: 0,
            Ignored: 0,
            Pending: 0,
          };

          for (const file of Object.values(report.files ?? {})) {
            for (const mutant of file.mutants ?? []) {
              const status = mutant.status ?? 'Pending';
              if (status in counts) {
                counts[status] += 1;
              } else {
                counts.Pending += 1;
              }
            }
          }

          const totalRelevant =
            counts.Killed +
            counts.Survived +
            counts.Timeout +
            counts.NoCoverage +
            counts.RuntimeError +
            counts.CompileError;
          const score =
            totalRelevant > 0
              ? ((counts.Killed + counts.Timeout) / totalRelevant) * 100
              : 0;
          const scoreText = Number.isFinite(score) ? score.toFixed(2) : 'n/a';

          const status =
            threshold == null
              ? 'No break threshold configured'
              : score >= Number(threshold)
                ? `Passing (>= ${threshold})`
                : `Failing (< ${threshold})`;

          const lines = [
            '## Mutation Tests (Stryker)',
            '',
            `- Mutation score: **${scoreText}%**`,
            `- Threshold: **${threshold ?? 'not set'}**`,
            `- Status: **${status}**`,
            '',
            '| Metric | Count |',
            '|---|---:|',
            `| Killed | ${counts.Killed} |`,
            `| Survived | ${counts.Survived} |`,
            `| Timeout | ${counts.Timeout} |`,
            `| No coverage | ${counts.NoCoverage} |`,
            `| Runtime errors | ${counts.RuntimeError} |`,
            `| Compile errors | ${counts.CompileError} |`,
            `| Ignored | ${counts.Ignored} |`,
            `| Pending/Unknown | ${counts.Pending} |`,
            '',
            '_Generated from `reports/mutation/mutation.json`_',
          ];

          fs.writeFileSync(outputPath, `${lines.join('\n')}\n`);
          EOF

      - name: Publish mutation summary to PR
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: mutation-test-results.md
          recreate: true
