name: Size Limit (PR signal)

on:
  pull_request:
    branches:
      - dev
      - release

permissions:
  contents: read
  pull-requests: write

jobs:
  size-limit:
    name: Size Limit (informational)
    # Release flow only:
    # - feature/* -> dev
    # - dev -> release
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        (
          (github.base_ref == 'dev' && startsWith(github.head_ref, 'feature/')) ||
          (github.base_ref == 'release' && github.head_ref == 'dev')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.10'
          cache: npm

      - name: Install dependencies
        run: npm ci --force

      - name: Build workspaces
        run: npm run build

      - name: Run Size Limit (non-blocking)
        id: run-size-limit
        shell: bash
        run: |
          set +e
          npm run size > size-limit-raw.txt 2>&1
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build size report markdown
        shell: bash
        run: |
          if [ "${{ steps.run-size-limit.outputs.exit_code }}" = "0" ]; then
            status_text="PASS (within configured limit)"
          else
            status_text="OVER LIMIT (informational only)"
          fi
          {
            echo "## Size Limit Report"
            echo
            echo "- Status: **${status_text}**"
            echo "- Policy: **non-blocking** (PR signal only)"
            echo "- Scope: renderer + main + preload built JS total"
            echo
            echo "<details><summary>CLI output</summary>"
            echo
            echo "\`\`\`text"
            cat size-limit-raw.txt
            echo "\`\`\`"
            echo
            echo "</details>"
          } > size-limit-report.md

      - name: Publish size report to PR (sticky)
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: size-limit-report.md
          header: size-limit-report
          recreate: true
